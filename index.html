    --brand: #006085;
    --brand-deep: #00445E;
    --brand-tint: #E3EFF4;
    --bg: #F3F6F8;
    --surface: #FFFFFF;
    --ink: #14303D;
    --muted: #5E717C;
    --line: #D7E1E7;
    --ok: #2B7A4B;
    --ok-tint: #E2F2E8;
    --open: #8A5A00;
    --open-tint: #FDF1D8;
    --danger: #B3261E;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 Rubik, Arial, sans-serif; }
  h1, h2, h3 { font-family: 'Varela Round', Rubik, Arial, sans-serif; font-weight: 400; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- כותרת תחתונה וגרסה ---------- */
  .foot { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7; padding: 28px 16px 36px; }
  .foot .ver { display: inline-block; margin-bottom: 6px; padding: 2px 10px; border-radius: 999px; background: var(--brand-tint); color: var(--brand-deep); font-weight: 500; }
  .foot div { direction: ltr; }
  .login-card .foot { padding: 22px 0 0; margin-top: 22px; border-top: 1px solid var(--line); }

  /* ---------- כפתורים ושדות ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; font-weight: 500; transition: background .15s; }
  .btn:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--brand); color: #fff; }
  .primary:hover:not(:disabled) { background: var(--brand-deep); }
  .soft { background: var(--brand-tint); color: var(--brand-deep); }
  .soft:hover { background: #D2E5EE; }
  .quiet { background: transparent; color: var(--muted); padding: 10px 12px; }
  .quiet:hover { color: var(--ink); }
  .danger { background: transparent; color: var(--danger); padding: 10px 12px; }
  .wide { width: 100%; padding: 14px; font-size: 17px; }

  label { display: block; font-size: 14px; font-weight: 500; color: var(--muted); margin-bottom: 14px; }
  input, select, textarea { display: block; width: 100%; margin-top: 6px; padding: 12px 14px; font-size: 16px; color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px; background: #fff; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px rgba(0, 96, 133, .15); }
  textarea { resize: vertical; }
  .err { color: var(--danger); min-height: 1.2em; margin: 4px 0 10px; font-size: 14px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }

  /* ---------- כניסה ---------- */
  .login { min-height: 100vh; display: grid; align-content: center; place-items: center; padding: 24px; background: linear-gradient(to bottom, var(--brand-tint), var(--bg) 60%); }
  .login-card { width: min(400px, 100%); background: var(--surface); border-radius: 22px; padding: 36px 28px 28px; box-shadow: 0 10px 40px rgba(0, 68, 94, .12); }
  .login-card img { display: block; width: 190px; max-width: 70%; margin: 0 auto 8px; }
  .login-card h1 { text-align: center; font-size: 19px; color: var(--muted); margin: 6px 0 28px; }

  /* ---------- מבנה ---------- */
  .top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 12px; }
  .top img { height: 19px; display: block; flex: none; }
  .who-me { display: flex; align-items: center; gap: 4px; }
  .me { text-align: left; line-height: 1.25; }
  .me strong { display: block; font-weight: 500; }
  .me span { font-size: 13px; color: var(--muted); }
  .tabs { flex: 1; min-width: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { background: none; border: 0; padding: 7px 12px; border-radius: 999px; color: var(--muted); cursor: pointer; white-space: nowrap; font-size: 14px; }
  .tabs button[aria-selected="true"] { color: var(--brand-deep); background: var(--brand-tint); font-weight: 500; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 10px 12px 8px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .bar h2 { margin: 0; font-size: 24px; }
  .summary { color: var(--muted); font-size: 14px; margin: -8px 0 14px; }

  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px 0; margin-bottom: 12px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 4px; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
  .chip b { font-weight: 600; color: var(--brand); }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
  .chip[aria-pressed="true"] b { color: #fff; }

  /* ---------- ימים: פס עבה ומעוגל כמו קווי הלוגו ---------- */
  .day { margin-top: 14px; }
  .day-head { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
  .day-head h3 { margin: 0; font-size: 19px; color: var(--brand-deep); white-space: nowrap; }
  .day-head .count { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .day-head::after { content: ""; flex: 1; height: 8px; border-radius: 999px; background: var(--brand-tint); }
  .day.today .day-head::after { background: var(--brand); }
  .day.late .day-head h3 { color: var(--danger); }
  .day.late .day-head::after { background: #F3D6D3; }

  /* ---------- כרטיס משימה ---------- */
  .task { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 16px 10px 12px; margin-bottom: 12px; overflow: hidden; }
  .task::before { content: ""; position: absolute; inset-block: 12px; inset-inline-start: 0; width: 5px; border-radius: 0 999px 999px 0; background: var(--brand); }
  .task.done::before { background: var(--ok); }
  .task.done { background: #FAFCFB; }
  .row1 { display: flex; gap: 10px; align-items: flex-start; }
  .row1 h4 { margin: 0; font-size: 17px; font-weight: 500; flex: 1; }
  .time { flex: none; font-weight: 600; color: var(--brand); background: var(--brand-tint); padding: 1px 9px; border-radius: 8px; direction: ltr; font-size: 15px; }
  .status { flex: none; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; }
  .status.open { background: var(--open-tint); color: var(--open); }
  .status.ok { background: var(--ok-tint); color: var(--ok); }
  .assignee { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 500; color: var(--brand-deep); background: var(--brand-tint); padding: 2px 10px; border-radius: 999px; }
  .meta { margin-top: 8px; display: grid; gap: 4px; }
  .meta a { color: var(--brand); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .details { margin: 10px 0 0; white-space: pre-wrap; color: var(--muted); }
  .closed { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--ok-tint); }
  .closed-at { font-size: 13px; color: var(--ok); font-weight: 500; }
  .closed p { margin: 4px 0 0; white-space: pre-wrap; }
  .closed .loc { display: inline-block; margin-top: 6px; font-size: 14px; color: var(--ok); text-decoration: none; font-weight: 500; }
  .closed .loc:hover { text-decoration: underline; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; }
  .actions .primary { flex: 1 1 auto; max-width: 220px; }
  @media (max-width: 520px) { .actions .primary { max-width: none; } }

  .empty { text-align: center; padding: 48px 16px; color: var(--muted); background: var(--surface); border: 1.5px dashed var(--line); border-radius: var(--radius); margin-top: 16px; }
  .loading { color: var(--muted); padding: 20px 0; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

  /* ---------- חלונות והודעות ---------- */
  dialog { border: 0; border-radius: 20px; padding: 24px; width: min(540px, 94vw); max-height: 90vh; color: var(--ink); }
  dialog::backdrop { background: rgba(0, 46, 64, .5); }
  dialog h3 { margin: 0 0 6px; font-size: 21px; }
  dialog .sub { margin: 0 0 18px; color: var(--muted); }
  #toast { position: fixed; bottom: 24px; inset-inline: 0; margin: auto; width: max-content; max-width: 90vw; background: var(--brand-deep); color: #fff; padding: 11px 20px; border-radius: 999px; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { #toast, .btn { transition: none; } }

  /* ---------- סרגל בקרה ---------- */
  .bar-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .wa { background: #1F8F4E; color: #fff; }
  .wa:hover { background: #177A41; }
  a.btn { text-decoration: none; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; margin-bottom: 10px; }
  .controls .range { margin-inline-start: auto; padding: 0 8px; font-size: 14px; }
  .controls .seg button { padding: 6px 11px; font-size: 13px; }
  .icon-btn { padding: 0; width: 42px; height: 42px; }
  .icon-btn.sm, .btn.sm { height: 34px; font-size: 13px; }
  .btn.sm:not(.icon-btn) { padding: 0 12px; }
  .icon-btn.sm { width: 34px; }
  .actions .icon-btn { flex: none; }
  .wa-preview { margin: 0 0 12px; max-height: 52vh; overflow-y: scroll; white-space: pre-wrap; word-break: break-word; font: 14px/1.55 Rubik, Arial, sans-serif; background: #ECE5DD; border-radius: 12px; padding: 14px; scrollbar-gutter: stable; }
  .wa-preview b { font-weight: 600; }
  .wa-preview::-webkit-scrollbar { width: 10px; }
  .wa-preview::-webkit-scrollbar-thumb { background: #9DB2BD; border-radius: 10px; }
  .controls .range { font-weight: 500; color: var(--brand-deep); }
  .controls .range-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; flex: 1 1 280px; }
  .controls .range-fields label { margin: 0; }
  .nav { display: inline-flex; gap: 4px; }

  .seg { display: inline-flex; background: var(--bg); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--brand); font-weight: 500; box-shadow: 0 1px 3px rgba(0, 68, 94, .18); }
  .filter-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .filter-row .summary { margin: 0; }
  .filter-row .seg { background: var(--surface); border: 1px solid var(--line); }
  .filter-row .seg button[aria-pressed="true"] { background: var(--brand); color: #fff; box-shadow: none; }

  /* ---------- שדה תאריך בפורמט DD/MM/YYYY ---------- */
  .df { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font-size: 16px; font-weight: 400; }
  .df:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(0, 96, 133, .15); }
  .df input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; opacity: 0; cursor: pointer; }
  .df svg { flex: none; color: var(--brand); }

  .day-head .date { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .late-date { display: inline-block; margin-top: 6px; margin-inline-end: 6px; font-size: 13px; color: var(--danger); font-weight: 500; }

  /* ---------- יומן ---------- */
  :root { --weekend: #E4EFF6; }
  .chip .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .task.by-user::before { background: var(--uc); }
  .assignee[style] { color: #fff; }
  .cal-dh.is-weekend, .cal-ad.is-weekend { background: var(--weekend); }
  .cal-col.is-weekend { background-color: var(--weekend); }
  .cal-ev.by-user.done { opacity: .6; }

  .month { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-top: 8px; }
  .m-head, .m-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .m-head div { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 2px; border-bottom: 1px solid var(--line); }
  .m-head .is-weekend { background: var(--weekend); }
  .mc { min-height: 86px; min-width: 0; border-inline-start: 1px solid var(--line); border-top: 1px solid var(--line); padding: 4px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; background: var(--surface); }
  .mc:nth-child(7n+1) { border-inline-start: 0; }
  .mc:nth-child(-n+7) { border-top: 0; }
  .mc:hover { box-shadow: inset 0 0 0 2px var(--brand-tint); }
  .mc.is-weekend { background: var(--weekend); }
  .mc.out .mc-num { color: #A3B2BB; }
  .mc.out .mc-ev { opacity: .55; }
  .mc-top { display: flex; align-items: center; justify-content: space-between; }
  .mc-num { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; font-size: 13px; font-weight: 500; }
  .mc.is-today .mc-num { background: var(--brand); color: #fff; }
  .mc-add { width: 26px; height: 26px; border: 0; border-radius: 50%; background: none; color: var(--brand); font-size: 18px; line-height: 1; cursor: pointer; opacity: 0; }
  .mc:hover .mc-add, .mc-add:focus-visible { opacity: 1; background: var(--brand-tint); }
  .mc-ev { display: block; width: 100%; border: 0; border-radius: 6px; padding: 2px 6px; background: var(--brand); color: #fff; font-size: 11px; text-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .mc-ev.done { opacity: .6; }
  .mc-more { font-size: 11px; color: var(--brand-deep); padding: 0 4px; }
  @media (max-width: 600px) {
    .mc { min-height: 70px; padding: 3px 2px; }
    .mc-ev { font-size: 0; height: 6px; padding: 0; }
    .mc-add { display: none; }
    .mc-more { font-size: 10px; padding: 0; }
  }
  .cal { --hp: 56px; --colmin: 96px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-top: 8px; }
  .cal-scroll { max-height: max(340px, calc(100vh - 190px)); overflow: auto; }
  .cal-grid { display: grid; grid-template-columns: 52px repeat(var(--n), minmax(var(--colmin), 1fr)); }
  .cal-top { position: sticky; top: 0; z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); }
  .cal-dh { text-align: center; padding: 8px 2px 6px; font-size: 12px; color: var(--muted); border-inline-start: 1px solid var(--line); }
  .cal-dh strong { display: block; font-size: 13px; color: var(--ink); font-weight: 500; }
  .cal-dh.is-today strong { color: var(--brand); }
  .cal-dh.is-today { box-shadow: inset 0 -3px 0 var(--brand); }
  .cal-adl { font-size: 11px; color: var(--muted); text-align: center; padding: 6px 2px; }
  .cal-ad { border-inline-start: 1px solid var(--line); border-top: 1px solid var(--line); padding: 4px; display: grid; gap: 3px; align-content: start; }
  .cal-hour { height: var(--hp); font-size: 11px; color: var(--muted); text-align: center; transform: translateY(-7px); }
  .cal-hour:first-child { transform: none; }
  .cal-col { position: relative; border-inline-start: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px calc(var(--hp) / 2), #EEF2F5 calc(var(--hp) / 2) calc(var(--hp) / 2 + 1px), transparent calc(var(--hp) / 2 + 1px) var(--hp)); }
  .cal-col.is-today { background-color: #F6FAFC; }
  .cal-slot { position: absolute; inset-inline: 0; border: 0; padding: 0 6px; background: transparent; cursor: pointer; text-align: start; font-size: 12px; color: transparent; }
  .cal-slot:hover, .cal-slot:focus-visible { background: var(--brand-tint); color: var(--brand-deep); outline: none; }
  .cal-ev { position: absolute; z-index: 1; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; border: 0; border-radius: 8px; padding: 3px 7px; background: var(--brand); color: #fff; text-align: start; font-size: 12px; line-height: 1.3; overflow: hidden; cursor: pointer; box-shadow: 0 0 0 1.5px var(--surface); }
  .cal-ev.done { background: var(--ok); }
  .cal-ev b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-ev span { display: block; text-align: right; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-chip { position: static; display: block; width: 100%; }
  .cal-now { position: absolute; inset-inline: 0; height: 2px; background: var(--danger); z-index: 2; pointer-events: none; }
  .cal-now::before { content: ""; position: absolute; inset-inline-start: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
  .cal-hint { font-size: 13px; color: var(--muted); margin: 8px 2px 0; }
  .conflict { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #FCEBE9; color: var(--danger); border-radius: 10px; padding: 10px 12px; }

  /* ---------- גרסה 2.1: הכל קומפקטי ---------- */
  .who-me { flex: none; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .logout { display: grid; place-items: center; width: 28px; height: 22px; border: 0; border-radius: 6px; background: none; color: var(--danger); cursor: pointer; padding: 0; }
  .logout:hover { background: #FCEBE9; }
  .me { text-align: start; }
  .me strong { display: inline; font-size: 14px; }
  .me span { margin-inline-start: 6px; font-size: 12px; }
  .top .btn.quiet { padding: 6px 10px; font-size: 14px; }
  .controls { margin-bottom: 6px; }
  .controls .range { margin-inline-start: 0; }
  .controls .bar-actions { margin-inline-start: auto; gap: 6px; }
  .filter-row { flex-wrap: nowrap; gap: 8px; margin-bottom: 4px; }
  .filter-row .chips { flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; margin: 0; padding: 2px 0; }
  .filter-row .summary { flex: none; font-size: 13px; }
  .filter-row .seg button { padding: 5px 11px; font-size: 13px; }
  .chip { padding: 4px 11px; font-size: 13px; }
  .row1 h4 { font-size: 16px; }
  .meta { margin-top: 4px; gap: 2px; }
  .details { margin-top: 6px; }
  .closed { margin-top: 8px; padding: 8px 10px; }
  .actions { margin-top: 10px; }
  .day-head { margin-bottom: 8px; }
  .day-head h3 { font-size: 17px; }
  .empty { padding: 28px 16px; margin-top: 10px; }
  .cal { margin-top: 4px; }
  .cal-hint { margin: 4px 2px 0; font-size: 12px; }
  .foot.compact { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 10px; padding: 10px 12px 14px; font-size: 12px; line-height: 1.4; }
  .foot.compact .ver { margin: 0; }
  @media (max-width: 600px) {
    .me span { display: none; }
    .me strong { font-size: 13px; }
    .tabs button { padding: 6px 9px; font-size: 13px; }
    .filter-row { flex-wrap: wrap; }
    .filter-row .chips { order: 3; flex-basis: 100%; }
    .controls .bar-actions { margin-inline-start: auto; }
    .hide-sm { display: none; }
  }

  /* ---------- גרסה 2.3: לקוחות, אנשי קשר, התקנה ---------- */
  .field { margin-bottom: 14px; }
  .flabel { display: block; font-size: 14px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .contact-row { display: grid; grid-template-columns: 1fr 1fr 38px; gap: 6px; margin-bottom: 6px; }
  .contact-row input { margin-top: 0; padding: 10px 12px; }
  .x-btn { display: grid; place-items: center; border: 0; border-radius: 10px; background: #FCEBE9; color: var(--danger); cursor: pointer; }
  .x-btn:hover { background: #F7D5D1; }
  .add-contact { color: var(--brand); padding: 4px 8px; }
  .cust-hint { margin: -8px 0 12px; font-size: 13px; color: var(--ok); min-height: 0; }
  .cust-hint:empty { display: none; }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .dlg-head h3 { margin: 0; }
  .cust-list { display: grid; gap: 6px; max-height: 50vh; overflow-y: auto; margin: 10px 0 4px; }
  .cust-item { display: grid; gap: 2px; text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .cust-item:hover, .cust-item:focus-visible { border-color: var(--brand); }
  .cust-item span { font-size: 13px; color: var(--muted); }
  .meta .cust-name { font-weight: 500; }
  .contact { display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .install-wrap { flex-basis: 100%; display: flex; justify-content: center; margin-top: 8px; }
  .install-btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--brand); background: var(--surface); color: var(--brand); border-radius: 999px; padding: 7px 16px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .install-btn:hover { background: var(--brand-tint); }

    if (c == null || c === false) return;
    e.append(c instanceof Node ? c : document.createTextNode(String(c))); // תמיד כטקסט, אף פעם לא כ-HTML
  });
  return e;
}

async function run(fn, ...args) {
  let res, data;
  try {
    // בלי כותרת Content-Type, כדי שהדפדפן ישלח בקשה פשוטה ש-Apps Script מקבל
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) });
  } catch (e) {
    throw new Error('אין חיבור לשרת. בדוק את החיבור לאינטרנט, וודא שהפרסום ב-Apps Script מוגדר ל-Anyone.');
  }
  try { data = await res.json(); }
  catch (e) { throw new Error('השרת לא ענה כמו שצריך. ודא שהפרסום ב-Apps Script מוגדר ל-Anyone ושקישור השרת נכון.'); }
  if (!data.ok) {
    const msg = String(data.error || 'שגיאה לא ידועה').replace(/^(Error|Exception):\s*/, '');
    if (msg.includes('SESSION_EXPIRED')) {
      clearSession();
      renderLogin('החיבור הסתיים. יש להתחבר מחדש.');
    }
    throw new Error(msg);
  }
  return data.data;
}
const api = (fn, ...args) => run(fn, S.token, ...args);

// ---------- תאריכים ושעות ----------
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseIso(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); }
function shiftIso(s, n) { const d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); }
function fmtDate(s) { if (!s) return ''; const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y; }
function weekday(s) { return 'יום ' + WEEKDAYS[parseIso(s).getDay()]; }
function dayTitle(s) {
  if (s === addDays(0)) return 'היום';
  if (s === addDays(1)) return 'מחר';
  if (s === addDays(-1)) return 'אתמול';
  return weekday(s);
}
function toMin(t) { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; }
function fmtMin(n) { return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); }
function timeRange(t) {
  const s = toMin(t.time);
  return s == null ? '' : fmtMin(s) + '–' + fmtMin(Math.min(s + (t.duration || 60), 24 * 60 - 1));
}
const LTR = s => '\u2066' + s + '\u2069'; // שומר על סדר נכון של שעות בתוך טקסט עברי
function userColor(name) {
  let i = S.users.findIndex(u => String(u.username).trim().toLowerCase() === String(name).trim().toLowerCase());
  if (i < 0) i = [...String(name)].reduce((a, c) => a + c.charCodeAt(0), 0);
  return USER_COLORS[i % USER_COLORS.length];
}
const isWeekend = s => parseIso(s).getDay() >= 5; // שישי ושבת
const same = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();

// ---------- מסך משימות (רשימה או יומן) ----------
function calRange() {
  const a = S.calDate || addDays(0);
  if (S.calMode === 'day') return { from: a, to: a, days: [a] };
  if (S.calMode === 'month') {
    const d = parseIso(a), first = new Date(d.getFullYear(), d.getMonth(), 1), last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    const from = shiftIso(iso(first), -first.getDay()), to = shiftIso(iso(last), 6 - last.getDay());
    const days = [];
    for (let x = from; x <= to; x = shiftIso(x, 1)) days.push(x);
    return { from: from, to: to, days: days, month: d.getMonth() };
  }
  const start = shiftIso(a, -parseIso(a).getDay());
  const days = Array.from({ length: 7 }, (_, i) => shiftIso(start, i));
  return { from: days[0], to: days[6], days: days };
}

function stepCal(dir) {
  if (S.calMode === 'day') return shiftIso(S.calDate, dir);
  if (S.calMode === 'week') return shiftIso(S.calDate, 7 * dir);
  const d = parseIso(S.calDate);
  return iso(new Date(d.getFullYear(), d.getMonth() + dir, 1));
}

}

      h('button', { class: 'btn soft sm', onclick: () => { S.calDate = addDays(0); reload(); } }, 'היום'),
      h('button', { class: 'btn soft icon-btn sm', title: 'הבא', 'aria-label': 'הבא', onclick: () => { S.calDate = stepCal(1); reload(); } }, icon('next'))),
    h('span', { class: 'range' + (isCal && S.calMode !== 'month' ? ' hide-sm' : '') }, rangeText()),
    h('div', { class: 'bar-actions' }, actions));

  const userChips = h('div', { class: 'chips' });
  const summary = h('p', { class: 'summary' });
  const content = h('div', null, loading());

  body.replaceChildren(
    controls,
    h('div', { class: 'filter-row' },
      seg([['all', 'הכל'], ['open', 'פתוחות'], ['done', 'סגורות']], S.status, v => { S.status = v; }, reload, 'סטטוס'),
      cfg.board ? userChips : null,
      summary),
    content);

  try {
    let tasks;
    if (cfg.board) {
      const r = await api('getBoard', cr.from, cr.to);
      S.users = r.users;
      tasks = r.tasks;
      if (isCal) tasks = tasks.filter(t => t.date >= cr.from && t.date <= cr.to);
      const openOf = name => tasks.filter(t => t.status !== DONE && (!name || same(t.installer, name))).length;
      const chip = (value, label) => h('button', {
        class: 'chip', 'aria-pressed': String(same(S.filter, value)),
        onclick: () => { S.filter = value; reload(); }
      }, value ? h('i', { class: 'dot', style: 'background:' + userColor(value) }) : null, label, h('b', null, openOf(value)));
      userChips.replaceChildren(chip('', 'כולם'), ...r.users.map(u => chip(u.username, u.username)));
      if (S.filter) tasks = tasks.filter(t => same(t.installer, S.filter));
    } else if (isCal) {
      tasks = await api('getMyTasks', cr.from, cr.to);
    } else {
      // ברשימה מציגים גם משימות פתוחות מימים קודמים, כדי שלא יישכחו
      const [inRange, upcoming] = await Promise.all([api('getMyTasks', cr.from, cr.to), api('getMyTasks')]);
      const today = addDays(0);
      tasks = inRange.concat(upcoming.filter(t => t.status !== DONE && t.date < today && !inRange.some(x => x.id === t.id)));
    }
    const openN = tasks.filter(t => t.status !== DONE).length;
    summary.textContent = openN + ' פתוחות, ' + (tasks.length - openN) + ' סגורות';
    shown = tasks.filter(t => S.status === 'all' || (S.status === 'done') === (t.status === DONE));
    content.replaceChildren(...(isCal
      ? (S.calMode === 'month' ? monthView(shown, cr, cfg, reload) : calendarView(shown, cr.days, cfg, reload))
      : groupView(shown, cfg, reload)));
  } catch (e) { content.replaceChildren(h('p', { class: 'err' }, e.message)); }
}

// ---------- רשימה לפי ימים ----------
function groupView(tasks, cfg, reload) {
  const today = addDays(0);
  const late = tasks.filter(t => t.status !== DONE && t.date < today);
  const rest = tasks.filter(t => !late.includes(t));
  const groups = [];
  if (late.length) groups.push({ label: 'באיחור', cls: 'late', items: late });
  rest.forEach(t => {
    let g = groups.find(x => x.date === t.date);
    if (!g) { g = { date: t.date, label: dayTitle(t.date), cls: t.date === today ? 'today' : '', items: [] }; groups.push(g); }
    g.items.push(t);
  });
  if (!groups.length) {
    return [h('div', { class: 'empty' }, cfg.board ? 'אין משימות שמתאימות לסינון בטווח הזה. אפשר להוסיף משימה חדשה בכפתור למעלה.' : 'אין משימות שמתאימות לסינון בטווח הזה.')];
  }
  return groups.map(g => {
    const open = g.items.filter(t => t.status !== DONE).length;
    return h('section', { class: 'day ' + g.cls },
      h('div', { class: 'day-head' },
        h('h3', null, g.label),
        g.date ? h('span', { class: 'date' }, fmtDate(g.date)) : null,
        h('span', { class: 'count' }, open ? open + ' פתוחות' : 'הכל נסגר')),
      g.items.map(t => card(t, cfg, reload, g.cls === 'late')));
  });
}

function card(t, cfg, reload, showDate) {
  const done = t.status === DONE;
  const actions = [];
  if (!done) actions.push(h('button', { class: 'btn primary', onclick: () => openClose(t, reload) }, 'סגירת משימה'));
  actions.push(h('a', { class: 'btn wa icon-btn', href: waLink(taskText(t, cfg.board)), target: '_blank', rel: 'noopener', title: 'שליחה בוואטסאפ', 'aria-label': 'שליחה בוואטסאפ' }, icon('chat')));
  if (cfg.admin) {
    if (done) actions.push(h('button', { class: 'btn soft', onclick: () => reopen(t, reload) }, 'פתיחה מחדש'));
    actions.push(h('button', { class: 'btn quiet', onclick: () => openTaskForm(t, reload) }, 'עריכה'));
    actions.push(h('button', { class: 'btn danger', onclick: () => removeTask(t, reload) }, 'מחיקה'));
  }
  return h('article', { class: 'task' + (done ? ' done' : '') + (cfg.board ? ' by-user' : ''), style: cfg.board ? '--uc:' + userColor(t.installer) : null },
    h('div', { class: 'row1' },
      t.time ? h('span', { class: 'time', dir: 'ltr' }, timeRange(t)) : null,
      h('h4', null, t.title),
      h('span', { class: 'status ' + (done ? 'ok' : 'open') }, t.status)),
    showDate ? h('span', { class: 'late-date' }, weekday(t.date) + ', ' + fmtDate(t.date)) : null,
    cfg.board ? h('span', { class: 'assignee', style: 'background:' + userColor(t.installer) }, t.installer) : null,
    (t.customer || t.address || taskContacts(t).length) ? h('div', { class: 'meta' },
      t.customer ? h('div', { class: 'cust-name' }, t.customer) : null,
      t.address ? h('a', { href: 'https://waze.com/ul?navigate=yes&q=' + encodeURIComponent(t.address), target: '_blank', rel: 'noopener' }, '📍 ' + t.address) : null,
      taskContacts(t).map(c => h('div', { class: 'contact' },
        c.name ? h('span', null, '👤 ' + c.name) : null,
        c.phone ? h('a', { href: telHref(c.phone), dir: 'ltr' }, '📞 ' + c.phone) : null))) : null,
    t.details ? h('p', { class: 'details' }, t.details) : null,
    done ? h('div', { class: 'closed' },
      h('div', { class: 'closed-at' }, 'נסגרה ב-' + t.closedAt + (cfg.board && t.closedBy ? ' על ידי ' + t.closedBy : '')),
      h('p', null, t.closeNotes),
      validLoc(t.closeLoc) ? h('a', { class: 'loc', href: t.closeLoc, target: '_blank', rel: 'noopener' },
        '📍 מיקום בזמן הסגירה' + (t.closeAcc ? ' (דיוק של כ-' + t.closeAcc + ' מטר)' : '')) : null) : null,
    actions.length ? h('div', { class: 'actions' }, actions) : null);
}

const validLoc = u => /^https:\/\/www\.google\.com\/maps\?q=-?\d+(\.\d+)?,-?\d+(\.\d+)?$/.test(u || '');

// ---------- יומן ----------
function calendarView(tasks, days, cfg, reload) {
  const today = addDays(0);
  const startM = DAY_START * 60, endM = DAY_END * 60;
  const timed = tasks.filter(t => toMin(t.time) != null);
  const untimed = tasks.filter(t => toMin(t.time) == null);
  const style = '--n:' + days.length + (days.length === 1 ? ';--colmin:0px' : '');
  const pxPerMin = HOUR_PX / 60;

  const evButton = (t, extra) => h('button', {
    type: 'button', class: 'cal-ev' + (t.status === DONE ? ' done' : '') + (cfg.board ? ' by-user' : '') + (extra || ''),
    style: cfg.board ? 'background:' + userColor(t.installer) : null,
    title: t.title, onclick: () => openTaskDialog(t, cfg, reload)
  },
    h('b', null, (t.status === DONE ? '✓ ' : '') + t.title),
    h('span', { dir: 'ltr' }, timeRange(t)),
    cfg.board ? h('span', null, t.installer) : null);

  const head = h('div', { class: 'cal-grid cal-top', style: style },
    h('div'),
    days.map(d => h('div', { class: 'cal-dh' + (d === today ? ' is-today' : '') + (isWeekend(d) ? ' is-weekend' : '') },
      WEEKDAYS[parseIso(d).getDay()], h('strong', null, fmtDate(d)))),
    untimed.length ? [
      h('div', { class: 'cal-adl' }, 'ללא שעה'),
      days.map(d => h('div', { class: 'cal-ad' + (isWeekend(d) ? ' is-weekend' : '') }, untimed.filter(t => t.date === d).map(t => evButton(t, ' cal-chip'))))
    ] : null);

  const hours = h('div', null, Array.from({ length: DAY_END - DAY_START }, (_, i) => h('div', { class: 'cal-hour' }, fmtMin((DAY_START + i) * 60))));

  const cols = days.map(d => {
    const col = h('div', { class: 'cal-col' + (d === today ? ' is-today' : '') + (isWeekend(d) ? ' is-weekend' : ''), style: 'height:' + (endM - startM) * pxPerMin + 'px' });
    if (cfg.canCreate) {
      for (let m = startM; m < endM; m += 30) {
        col.append(h('button', {
          type: 'button', class: 'cal-slot', style: 'top:' + (m - startM) * pxPerMin + 'px;height:' + 30 * pxPerMin + 'px',
          'aria-label': 'משימה חדשה ב-' + fmtDate(d) + ' בשעה ' + fmtMin(m),
          onclick: () => openTaskForm({ date: d, time: fmtMin(m), installer: cfg.presetInstaller || S.filter }, reload)
        }, '+ ' + fmtMin(m)));
      }
    }
    // סידור משימות חופפות זו לצד זו
    const evs = timed.filter(t => t.date === d)
      .map(t => ({ t: t, s: toMin(t.time), e: toMin(t.time) + (t.duration || 60) }))
      .sort((a, b) => a.s - b.s || b.e - a.e);
    let cluster = [], clusterEnd = -1;
    const flush = () => {
      const lanes = [];
      cluster.forEach(ev => {
        let i = lanes.findIndex(end => end <= ev.s);
        if (i < 0) { i = lanes.length; lanes.push(0); }
        lanes[i] = ev.e; ev.lane = i;
      });
      cluster.forEach(ev => { ev.lanes = lanes.length; });
      cluster = [];
    };
    evs.forEach(ev => {
      if (ev.s >= clusterEnd) { flush(); clusterEnd = ev.e; } else clusterEnd = Math.max(clusterEnd, ev.e);
      cluster.push(ev);
    });
    flush();
    evs.forEach(ev => {
      const s = Math.min(Math.max(ev.s, startM), endM - 30), e = Math.max(Math.min(ev.e, endM), s + 30);
      const el = evButton(ev.t);
      el.style.top = (s - startM) * pxPerMin + 'px';
      el.style.height = Math.max((e - s) * pxPerMin - 2, 24) + 'px';
      el.style.insetInlineStart = 'calc(' + (100 * ev.lane / ev.lanes) + '% + 2px)';
      el.style.width = 'calc(' + (100 / ev.lanes) + '% - 4px)';
      col.append(el);
    });
    if (d === today) {
      const now = new Date(), nm = now.getHours() * 60 + now.getMinutes();
      if (nm >= startM && nm <= endM) col.append(h('div', { class: 'cal-now', style: 'top:' + (nm - startM) * pxPerMin + 'px' }));
    }
    return col;
  });

  const scroll = h('div', { class: 'cal-scroll' }, head, h('div', { class: 'cal-grid', style: style }, hours, cols));
  requestAnimationFrame(() => {
    const first = timed.reduce((m, t) => Math.min(m, Math.floor(toMin(t.time) / 60)), 24);
    const base = days.includes(today) ? new Date().getHours() - 1 : 7;
    const target = Math.max(Math.min(first, base), DAY_START);
    scroll.scrollTop = (target - DAY_START) * HOUR_PX;
  });
  const out = [h('div', { class: 'cal', style: '--hp:' + HOUR_PX + 'px' }, scroll)];
  if (cfg.canCreate) out.push(h('p', { class: 'cal-hint' }, 'לחיצה על שעה פנויה ביומן פותחת משימה חדשה באותה שעה.'));
  if (!tasks.length) out.push(h('p', { class: 'cal-hint' }, 'אין משימות שמתאימות לסינון בטווח הזה.'));
  return out;
}

function monthView(tasks, cr, cfg, reload) {
  const today = addDays(0), MAX = 3;
  const goDay = d => { S.calDate = d; S.calMode = 'day'; reload(); };
  const head = h('div', { class: 'm-head' }, WEEKDAYS.map((w, i) => h('div', { class: i >= 5 ? 'is-weekend' : null }, w)));
  const cells = cr.days.map(d => {
    const list = tasks.filter(t => t.date === d).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
    const out = parseIso(d).getMonth() !== cr.month;
    return h('div', {
      class: 'mc' + (out ? ' out' : '') + (d === today ? ' is-today' : '') + (isWeekend(d) ? ' is-weekend' : ''),
      tabindex: '0', role: 'button', 'aria-label': weekday(d) + ', ' + fmtDate(d) + ', ' + list.length + ' משימות',
      onclick: () => goDay(d), onkeydown: e => { if (e.key === 'Enter') goDay(d); }
    },
      h('div', { class: 'mc-top' },
        h('span', { class: 'mc-num', title: fmtDate(d) }, parseIso(d).getDate()),
        cfg.canCreate ? h('button', {
          type: 'button', class: 'mc-add', 'aria-label': 'משימה חדשה ב-' + fmtDate(d),
          onclick: e => { e.stopPropagation(); openTaskForm({ date: d, installer: cfg.presetInstaller || S.filter }, reload); }
        }, '+') : null),
      list.slice(0, MAX).map(t => h('button', {
        type: 'button', class: 'mc-ev' + (t.status === DONE ? ' done' : ''),
        style: cfg.board ? 'background:' + userColor(t.installer) : (t.status === DONE ? 'background:var(--ok)' : null),
        title: (t.time ? t.time + ' ' : '') + t.title + (cfg.board ? ' (' + t.installer + ')' : ''),
        onclick: e => { e.stopPropagation(); openTaskDialog(t, cfg, reload); }
      }, (t.status === DONE ? '✓ ' : '') + (t.time ? t.time + ' ' : '') + t.title)),
      list.length > MAX ? h('span', { class: 'mc-more' }, 'עוד ' + (list.length - MAX)) : null);
  });
  const res = [h('div', { class: 'month' }, head, h('div', { class: 'm-grid' }, cells))];
  res.push(h('p', { class: 'cal-hint' }, 'לחיצה על יום פותחת אותו בתצוגת יום' + (cfg.canCreate ? ', והכפתור + מוסיף בו משימה.' : '.')));
  return res;
}

function openTaskDialog(t, cfg, reload) {
  showDialog(h('div', null,
    h('p', { class: 'sub' }, weekday(t.date) + ', ' + fmtDate(t.date)),
    card(t, cfg, () => { closeDialog(); reload(); }),
    h('div', { class: 'actions' }, h('button', { class: 'btn quiet', onclick: closeDialog }, 'סגירה'))));
}

// ---------- פעולות על משימות ----------
/** מיקום נוכחי מהמכשיר, באישור המשתמש. אם אין אישור או שזה לוקח יותר מדי זמן, ממשיכים בלי. */
function getLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  });
}

function openClose(t, reload) {
  const err = h('p', { class: 'err' });
  showDialog(h('form', {
    onsubmit: async ev => {
      ev.preventDefault();
      const f = ev.target, b = f.querySelector('[type=submit]'); b.disabled = true;
      b.textContent = 'מאתר מיקום…';
      const loc = await getLocation();
      b.textContent = 'סוגר…';
      try {
        const done = await api('closeTask', t.id, f.n.value, loc);
        closeDialog();
        toast('המשימה נסגרה ב-' + done.closedAt + (loc ? '' : ' (ללא מיקום)'));
        reload();
      } catch (e) { err.textContent = e.message; b.disabled = false; b.textContent = 'סגור משימה'; }
    }
  },
    h('h3', null, 'סגירת משימה'),
    h('p', { class: 'sub' }, t.title),
    h('label', null, 'מה נעשה בפועל?', h('textarea', { name: 'n', rows: 5, required: true, maxlength: 2000 })),
    h('p', { class: 'muted small' }, 'תאריך ושעת הסגירה נרשמים אוטומטית, יחד עם המיקום הנוכחי שלך (הטלפון יבקש אישור).'),
    err,
    h('div', { class: 'actions' },
      h('button', { class: 'btn primary', type: 'submit' }, 'סגור משימה'),
      h('button', { class: 'btn quiet', type: 'button', onclick: closeDialog }, 'ביטול'))));
}

async function openTaskForm(t, reload) {
  t = t || {};
  if (!S.users.length) {
    try { S.users = (await api('getBoard', addDays(0), addDays(0))).users; } catch (e) { toast(e.message); return; }
  }
  try { await loadCustomers(); } catch (e) {}
  const editing = !!t.id;
  const err = h('div', { class: 'err' });
  const ce = contactsEditor(taskContacts(t));
  const custHint = h('p', { class: 'cust-hint' });
  let filledFrom = '';
  const pickCustomer = e => {
    const c = (S.customers || []).find(x => same(x.name, e.target.value));
    if (!c || c.id === filledFrom) return;
    filledFrom = c.id;
    form.address.value = c.address || '';
    ce.set(c.contacts);
    custHint.textContent = 'הפרטים מולאו מרשימת הלקוחות.' + (c.notes ? ' הערות: ' + c.notes : '');
  };
  const pre = t.installer || S.filter || '';
  const option = u => h('option', { value: u.username, selected: same(u.username, pre) }, u.username);
  const dur = t.duration || 60;
  let form;

  const submit = async force => {
    const f = form, b = f.querySelector('[type=submit]');
    if (!f.reportValidity()) return;
    b.disabled = true; err.textContent = '';
    const data = { id: t.id || '', installer: f.installer.value, date: f.date.value, time: f.time.value, duration: Number(f.duration.value),
      title: f.title.value, customer: f.customer.value, contacts: ce.get(), address: f.address.value, details: f.details.value, force: force === true };
    try {
      await api('saveTask', data);
      closeDialog(); toast(editing ? 'המשימה עודכנה' : 'המשימה נוספה'); reload();
    } catch (e) {
      b.disabled = false;
      if (e.message.startsWith('CONFLICT|')) {
        err.replaceChildren(h('div', { class: 'conflict' },
          h('span', null, e.message.slice(9)),
          h('button', { type: 'button', class: 'btn soft', onclick: () => submit(true) }, 'לשמור בכל זאת')));
      } else err.textContent = e.message;
      err.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  };

  form = h('form', { onsubmit: ev => { ev.preventDefault(); submit(false); } },
    h('h3', null, editing ? 'עריכת משימה' : 'משימה חדשה'),
    h('p', { class: 'sub' }, editing ? 'השינויים יופיעו מיד אצל מי שהמשימה משויכת אליו.' : 'המשימה תופיע מיד אצל מי שתבחר.'),
    h('label', null, 'למי לשייך', h('select', { name: 'installer', required: true },
      h('option', { value: '', disabled: true, selected: !pre }, 'בחר משתמש'),
      h('optgroup', { label: 'טכנאים' }, S.users.filter(u => u.role === TECH).map(option)),
      h('optgroup', { label: 'מנהלים' }, S.users.filter(u => u.role === ADMIN).map(option)))),
    dateField('תאריך', t.date || S.calDate || addDays(0), null, 'date'),
    h('div', { class: 'grid2' },
      h('label', null, 'שעת התחלה', timeSelect(t.time || '')),
      h('label', null, 'משך', h('select', { name: 'duration' },
        DURATIONS.map(([v, l]) => h('option', { value: v, selected: v === dur }, l))))),
    h('label', null, 'מה צריך לעשות', h('input', { name: 'title', required: true, maxlength: 200, value: t.title || '' })),
    h('label', null, 'לקוח',
      h('input', { name: 'customer', maxlength: 120, value: t.customer || '', list: 'cust-list', autocomplete: 'off',
        placeholder: 'בחר מרשימת הלקוחות או כתוב שם', onchange: pickCustomer, oninput: pickCustomer }),
      h('datalist', { id: 'cust-list' }, (S.customers || []).map(c => h('option', { value: c.name })))),
    custHint,
    h('label', null, 'כתובת', h('input', { name: 'address', maxlength: 250, value: t.address || '' })),
    h('div', { class: 'field' }, h('span', { class: 'flabel' }, 'אנשי קשר למשימה'), ce.el,
      h('p', { class: 'muted small' }, 'אפשר להסיר עם ✕ את מי שלא רלוונטי, כך שלמשימה יישאר רק איש הקשר הישיר.')),
    h('label', null, 'פרטים נוספים', h('textarea', { name: 'details', rows: 3, maxlength: 2000 }, t.details || '')),
    err,
    h('div', { class: 'actions' },
      h('button', { class: 'btn primary', type: 'submit' }, editing ? 'שמירת שינויים' : 'הוספת משימה'),
      h('button', { class: 'btn quiet', type: 'button', onclick: closeDialog }, 'ביטול')));
  showDialog(form);
}

/** בחירת שעה בפורמט 24 שעות, בקפיצות של רבע שעה. */
function timeSelect(value) {
  const opts = [h('option', { value: '' }, 'ללא שעה')];
  const times = [];
  for (let m = 5 * 60; m < 23 * 60; m += 15) times.push(fmtMin(m));
  if (value && !times.includes(value)) times.push(value), times.sort();
  times.forEach(v => opts.push(h('option', { value: v, selected: v === value }, v)));
  return h('select', { name: 'time', dir: 'ltr' }, opts);
}

async function reopen(t, reload) {
  try { await api('reopenTask', t.id); toast('המשימה נפתחה מחדש'); reload(); } catch (e) { toast(e.message); }
}
async function removeTask(t, reload) {
  if (!confirm('למחוק את המשימה "' + t.title + '"? אי אפשר לבטל את זה.')) return;
  try { await api('deleteTask', t.id); toast('המשימה נמחקה'); reload(); } catch (e) { toast(e.message); }
}

// ---------- וואטסאפ ----------
function waLink(text) { return 'https://wa.me/?text=' + encodeURIComponent(text); }

function taskText(t, withAssignee) {
  const lines = ['*' + t.title + '*', '📅 ' + weekday(t.date) + ', ' + fmtDate(t.date) + (t.time ? ' ' + LTR(timeRange(t)) : '')];
  if (withAssignee) lines.push('👷 ' + t.installer);
  if (t.customer) lines.push('🏢 ' + t.customer);
  taskContacts(t).forEach(c => lines.push([c.name ? '👤 ' + c.name : '', c.phone ? '📞 ' + c.phone : ''].filter(Boolean).join('  ')));
  if (t.address) lines.push('📍 ' + t.address + '\nhttps://waze.com/ul?navigate=yes&q=' + encodeURIComponent(t.address));
  if (t.details) lines.push('📝 ' + t.details);
  lines.push('סטטוס: ' + t.status + (t.status === DONE && t.closedAt ? ' (' + t.closedAt + ')' : ''));
  if (t.status === DONE && t.closeNotes) lines.push('מה נעשה: ' + t.closeNotes);
  if (t.status === DONE && validLoc(t.closeLoc)) lines.push('מיקום בסגירה: ' + t.closeLoc);
  return lines.join('\n');
}

const LRM = '\u200E'; // שומר על סדר נכון של שעות בתוך טקסט עברי בוואטסאפ

/** הודעה מסודרת: לפי משתמש, ובתוך כל משתמש לפי תאריך ושעה. */
function buildWhatsAppList(tasks, range, statusLabel, cfg) {
  const SEP = '━━━━━━━━━━━━━━';
  const byUser = new Map();
  tasks.slice().sort((a, b) => (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')))
    .forEach(t => { const k = t.installer; if (!byUser.has(k)) byUser.set(k, []); byUser.get(k).push(t); });
  const order = S.users.map(u => u.username).filter(n => byUser.has(n)).concat([...byUser.keys()].filter(n => !S.users.some(u => u.username === n)));

  const out = ['*STERN | ניהול טכנאים*', '🗓️ ' + range + (statusLabel ? ' (' + statusLabel + ')' : ''), ''];
  order.forEach(name => {
    const list = byUser.get(name);
    const u = S.users.find(x => same(x.username, name));
    const open = list.filter(t => t.status !== DONE).length;
    out.push(SEP, '👷 *' + name + '*', (u ? u.role + ' | ' : '') + list.length + ' משימות, ' + open + ' פתוחות, ' + (list.length - open) + ' סגורות', '');
    let day = '';
    list.forEach(t => {
      if (t.date !== day) {
        day = t.date;
        out.push('📅 *' + weekday(day) + ', ' + fmtDate(day) + '*');
      }
      const time = t.time ? LRM + timeRange(t) + LRM : 'ללא שעה';
      out.push('🕒 ' + time + ' | ' + t.title);
      if (t.customer) out.push('      🏢 ' + t.customer);
      taskContacts(t).forEach(c => out.push('      ' + [c.name ? '👤 ' + c.name : '', c.phone ? '📞 ' + LRM + c.phone + LRM : ''].filter(Boolean).join('  ')));
      if (t.address) out.push('      📍 ' + t.address);
      if (t.details) out.push('      📝 ' + t.details.replace(/\n+/g, ' '));
      out.push('      ' + (t.status === DONE
        ? '✅ נסגרה ' + (t.closedAt || '') + (t.closeNotes ? ' | ' + t.closeNotes.replace(/\n+/g, ' ') : '')
        : '⏳ פתוחה'));
      out.push('');
    });
  });
  out.push(SEP, '_Stern Engineering LTD©_');
  return out.join('\n');
}

/** מציג את ההודעה כמו בוואטסאפ: *מודגש* ו-_נטוי_. */
function waPreview(text) {
  return text.split('\n').map(line => {
    const parts = [];
    line.split(/(\*[^*\n]+\*|_[^_\n]+_)/).forEach(p => {
      if (/^\*[^*]+\*$/.test(p)) parts.push(h('b', null, p.slice(1, -1)));
      else if (/^_[^_]+_$/.test(p)) parts.push(h('i', null, p.slice(1, -1)));
      else if (p) parts.push(p);
    });
    return h('div', { class: 'wa-line' }, parts.length ? parts : '\u00A0');
  });
}

function shareListWhatsApp(tasks, range, statusLabel, cfg) {
  if (!tasks.length) { toast('אין משימות לשיתוף'); return; }
  const text = buildWhatsAppList(tasks, range, statusLabel, cfg);
  const link = waLink(text);
  const long = link.length > 7000;
  showDialog(h('div', null,
    h('h3', null, 'שיתוף בוואטסאפ'),
    h('p', { class: 'sub' }, 'כך תיראה ההודעה. ' + tasks.length + ' משימות.'),
    h('div', { class: 'wa-preview', tabindex: '0' }, waPreview(text)),
    long ? h('p', { class: 'muted small' }, 'ההודעה ארוכה. אם וואטסאפ לא נפתח עם כל הטקסט, העתק אותה והדבק ידנית.') : null,
    h('div', { class: 'actions' },
      h('a', { class: 'btn wa icon-btn', href: link, target: '_blank', rel: 'noopener', title: 'שליחה בוואטסאפ', 'aria-label': 'שליחה בוואטסאפ' }, icon('chat')),
      h('button', {
        class: 'btn soft icon-btn', title: 'העתקה', 'aria-label': 'העתקה',
        onclick: async () => { try { await navigator.clipboard.writeText(text); toast('ההודעה הועתקה'); } catch (e) { toast('ההעתקה לא הצליחה'); } }
      }, icon('copy')),
      h('button', { class: 'btn quiet', onclick: closeDialog }, 'סגירה'))));
}

// ---------- PDF ----------
let jspdfLoading = null;
function loadJsPdf() {
  if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
  if (!jspdfLoading) {
    jspdfLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = JSPDF_URL;
      s.onload = () => resolve(window.jspdf.jsPDF);
      s.onerror = () => { jspdfLoading = null; reject(new Error('לא הצלחתי לטעון את רכיב ה-PDF. בדוק את החיבור לאינטרנט.')); };
      document.head.append(s);
    });
  }
  return jspdfLoading;
}

function loadImage(src) {
  return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
}

/** מצייר את הטבלה בעצמנו על דפים, כדי שהעברית תצא בכיוון הנכון. */
async function exportPdf(tasks, title, range, cfg) {
  if (!tasks.length) { toast('אין משימות לייצוא'); return; }
  toast('מכין PDF…');
  let JsPDF;
  try { JsPDF = await loadJsPdf(); } catch (e) { toast(e.message); return; }
  try { await document.fonts.load('16px Rubik'); await document.fonts.load('500 16px Rubik'); } catch (e) {}
  const logo = await loadImage(LOGO);

  const MM = 5, PW = 297, PH = 210, M = 10;               // A4 לרוחב, 5 פיקסלים למ"מ
  const FONT = 'Rubik, Arial, sans-serif';
  const cols = [
    { k: 'date', l: 'תאריך', w: 21 },
    { k: 'time', l: 'שעה', w: 23, ltr: true },
    cfg.board ? { k: 'installer', l: 'משויך ל', w: 22 } : null,
    { k: 'task', l: 'משימה', w: cfg.board ? 58 : 66 },
    { k: 'customer', l: 'לקוח', w: 23 },
    { k: 'contacts', l: 'איש קשר', w: 31 },
    { k: 'address', l: 'כתובת', w: 34 },
    { k: 'status', l: 'סטטוס', w: 28 },
    { k: 'notes', l: 'מה נעשה', w: 0 }
  ].filter(Boolean);
  const used = cols.reduce((a, c) => a + c.w, 0);
  cols[cols.length - 1].w = PW - 2 * M - used;

  const cellText = (t, k) => ({
    date: fmtDate(t.date), time: timeRange(t), installer: t.installer,
    task: [t.title, t.details], customer: t.customer, address: t.address,
    contacts: taskContacts(t).map(c => [c.name, c.phone].filter(Boolean).join(' ')).join('\n'),
    status: t.status + (t.status === DONE && t.closedAt ? '\n' + t.closedAt : ''),
    notes: t.status === DONE ? t.closeNotes : ''
  })[k];

  const pages = [];
  let cv, ctx, y;
  const FS = 3.1 * MM, LH = 4.4 * MM, PAD = 1.6 * MM;

  const setFont = (weight, size) => { ctx.font = weight + ' ' + size + 'px ' + FONT; };
  const wrap = (text, maxW) => {
    const out = [];
    String(text || '').split('\n').forEach(par => {
      let line = '';
      par.split(/\s+/).filter(Boolean).forEach(w => {
        const test = line ? line + ' ' + w : w;
        if (!line || ctx.measureText(test).width <= maxW) line = test;
        else { out.push(line); line = w; }
      });
      if (line) out.push(line);
    });
    return out;
  };
  const text = (str, xRight, yy, ltr) => {
    ctx.direction = ltr ? 'ltr' : 'rtl';
    ctx.textAlign = 'right';
    ctx.fillText(str, xRight, yy);
  };

  const newPage = () => {
    cv = document.createElement('canvas');
    cv.width = PW * MM; cv.height = PH * MM;
    ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.textBaseline = 'top';
    // כותרת
    ctx.fillStyle = '#00445E'; setFont('500', 5.2 * MM);
    text('STERN | ' + title, (PW - M) * MM, M * MM);
    ctx.fillStyle = '#5E717C'; setFont('400', 3.2 * MM);
    text(range + '   |   ' + tasks.length + ' משימות', (PW - M) * MM, (M + 7.5) * MM);
    if (logo) { const lh = 9 * MM, lw = lh * logo.width / logo.height; ctx.drawImage(logo, M * MM, M * MM, lw, lh); }
    ctx.fillStyle = '#006085'; ctx.fillRect(M * MM, (M + 13) * MM, (PW - 2 * M) * MM, 0.8 * MM);
    y = (M + 15.5) * MM;
    // שורת כותרות של הטבלה
    const hh = 7 * MM;
    ctx.fillStyle = '#006085'; ctx.fillRect(M * MM, y, (PW - 2 * M) * MM, hh);
    ctx.fillStyle = '#fff'; setFont('500', FS);
    let x = (PW - M) * MM;
    cols.forEach(c => { text(c.l, x - PAD, y + (hh - FS) / 2); x -= c.w * MM; });
    y += hh;
    pages.push(cv);
  };

  const bottom = (PH - M - 6) * MM;
  newPage();
  tasks.forEach((t, i) => {
    // מדידת גובה השורה
    const cells = cols.map(c => {
      const v = cellText(t, c.k), maxW = c.w * MM - 2 * PAD;
      if (Array.isArray(v)) {
        setFont('500', FS); const a = wrap(v[0], maxW);
        setFont('400', FS); const b = wrap(v[1], maxW);
        return { c: c, lines: a.map(s => ({ s: s, b: true })).concat(b.map(s => ({ s: s, muted: true }))) };
      }
      setFont('400', FS);
      return { c: c, lines: wrap(v, maxW).map(s => ({ s: s })) };
    });
    const rows = Math.max(1, ...cells.map(c => c.lines.length));
    const rh = rows * LH + 2 * PAD;
    if (y + rh > bottom) newPage();
    if (i % 2) { ctx.fillStyle = '#F3F7F9'; ctx.fillRect(M * MM, y, (PW - 2 * M) * MM, rh); }
    let x = (PW - M) * MM;
    cells.forEach(cell => {
      ctx.save();
      ctx.beginPath(); ctx.rect(x - cell.c.w * MM, y, cell.c.w * MM, rh); ctx.clip();
      cell.lines.forEach((ln, j) => {
        ctx.fillStyle = cell.c.k === 'status' && j === 0 ? (t.status === DONE ? '#2B7A4B' : '#8A5A00') : ln.muted ? '#5E717C' : '#14303D';
        setFont(ln.b || (cell.c.k === 'status' && j === 0) ? '500' : '400', FS);
        text(ln.s, x - PAD, y + PAD + j * LH, cell.c.ltr);
      });
      ctx.restore();
      x -= cell.c.w * MM;
    });
    ctx.fillStyle = '#D7E1E7'; ctx.fillRect(M * MM, y + rh - 1, (PW - 2 * M) * MM, 1);
    y += rh;
  });

  // תחתית כל דף
  const now = new Date();
  const stamp = fmtDate(iso(now)) + ' ' + fmtMin(now.getHours() * 60 + now.getMinutes());
  pages.forEach((p, i) => {
    const c = p.getContext('2d'); ctx = c;
    c.fillStyle = '#5E717C'; c.font = '400 ' + 2.8 * MM + 'px ' + FONT; c.textBaseline = 'top';
    text('עמוד ' + (i + 1) + ' מתוך ' + pages.length, (PW - M) * MM, (PH - M - 3) * MM);
    c.direction = 'ltr'; c.textAlign = 'left';
    c.fillText('Stern Engineering LTD©  |  ' + stamp, M * MM, (PH - M - 3) * MM);
  });

  const pdf = new JsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
  pages.forEach((p, i) => {
    if (i) pdf.addPage('a4', 'landscape');
    pdf.addImage(p.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, PW, PH);
  });
  pdf.setProperties({ title: 'STERN - ' + title, author: 'Stern Engineering LTD' });
  const blob = pdf.output('blob');
  const name = 'STERN-tasks-' + fmtDate(iso(now)).replace(/\//g, '-') + '.pdf';
  const file = new File([blob], name, { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  let canShare = false;
  try { canShare = isPhone && !!navigator.canShare && navigator.canShare({ files: [file] }); } catch (e) {}

  showDialog(h('div', null,
    h('h3', null, 'הקובץ מוכן'),
    h('p', { class: 'sub' }, title + ', ' + tasks.length + ' משימות, ' + pages.length + ' עמודים.'),
    h('div', { class: 'actions' },
      h('a', { class: 'btn primary icon-btn', href: url, download: name, title: 'הורדה', 'aria-label': 'הורדת הקובץ' }, icon('download')),
      canShare ? h('button', {
        class: 'btn soft icon-btn', title: 'שיתוף', 'aria-label': 'שיתוף הקובץ',
        onclick: async () => { try { await navigator.share({ files: [file], title: 'STERN - ' + title }); } catch (e) {} }
      }, icon('share')) : null,
      h('button', { class: 'btn quiet', onclick: closeDialog }, 'סגירה'))));
}

// ---------- הפעלה ----------
if (S.token) {
  api('getMe').then(u => { S.me = u; start(); }).catch(() => { clearSession(); renderLogin(); });
} else {
  renderLogin();
}
</script>
